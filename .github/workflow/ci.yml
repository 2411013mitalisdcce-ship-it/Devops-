name: CI-CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build website
        run: |
          mkdir build
          cp index.html build/
          cp style.css build/

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: website-build
          path: build/

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: website-build
          path: build/

      - name: Test website
        run: |
          if [ -f "build/index.html" ] && [ -f "build/style.css" ]; then
            echo "Website files found successfully."
          else
            echo "Website files are missing."
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './build'

  deploy:
    runs-on: ubuntu-latest
    needs: test

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4